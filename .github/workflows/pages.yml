name: Publish REAL mobile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare REAL static mobile app
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, pathlib, zipfile
          payload = base64.b64decode("")
          assert hashlib.sha256(payload).hexdigest() == "d232522082a7e136ed97e029cb9975d15fa3fa434731cff02a1b8062f24805a1"
          target = pathlib.Path('site').resolve()
          target.mkdir()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for entry in archive.infolist():
                  destination = (target / entry.filename).resolve()
                  assert destination.is_relative_to(target)
                  destination.write_bytes(archive.read(entry))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish phone website
        id: deployment
        uses: actions/deploy-pages@v4
